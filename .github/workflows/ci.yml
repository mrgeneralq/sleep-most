name: Build & Test

# Compiles the plugin and runs the unit tests on every push and pull request.
# This lets you confirm the code compiles and the tests pass without ever
# starting a Minecraft server.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # JDK 21 is required to read the Spigot/Paper 1.21.x API classes,
      # even though the plugin itself targets Java 11 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
